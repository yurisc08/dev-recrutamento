<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="DataHub - forum corporativo da equipe de Analise de Dados. Compartilhe ideias, sugestoes e atualizacoes de projetos." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>DataHub — Fórum da Equipe de Dados</title>
  </head>
  <body>
    <script>
      // Evita "flash" de tema errado antes do React montar.
      (function () {
        var stored = localStorage.getItem('datahub-theme')
        var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
