<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matéria — CINEVOLT</title>
<meta name="description" content="Leitura CINEVOLT.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/effects.css">
</head>
<body class="is-loading is-entering">

<div class="preloader">
  <div class="clapper"><div class="clapper__top"></div><div class="clapper__body">CINEVOLT</div></div>
  <div class="preloader__pct">000%</div><div class="preloader__bar"></div>
</div>

<div class="fx-layer fx-grain"></div>
<div class="fx-layer fx-scan"></div>
<div class="fx-layer fx-vignette"></div>
<div class="fx-layer fx-flash"></div>
<div class="progress"></div>

<header class="header">
  <div class="wrap header__inner">
    <a href="/" class="logo">
      <svg class="logo__bolt" viewBox="0 0 24 32"><path d="M14 0 2 18h7l-3 14 14-19h-8l2-13Z" fill="#00e5ff"/></svg>
      <span class="logo__text">CINE<b>VOLT</b></span>
    </a>
    <nav class="nav">
      <a class="nav__link" href="/">Início</a>
      <a class="nav__link" href="/arquivo.html">Arquivo</a>
      <a class="nav__link" href="/jogo.html">Jogo</a>
      <a class="nav__link" href="/sobre.html">Sobre</a>
      <a class="nav__link" href="/admin.html">Publicar</a>
    </nav>
    <button class="burger" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span></button>
  </div>
</header>

<div class="menu">
  <ul class="menu__list">
    <li><a href="/">Início</a></li><li><a href="/arquivo.html">Arquivo</a></li>
    <li><a href="/jogo.html">Jogo</a></li><li><a href="/sobre.html">Sobre</a></li>
    <li><a href="/admin.html">Publicar</a></li>
  </ul>
</div>

<main>
<article data-post>
  <!-- Capa -->
  <header class="post-capa">
    <div class="post-capa__img" data-parallax="0.12"></div>
    <div class="post-capa__grad"></div>
    <canvas class="post-capa__bolts" aria-hidden="true"></canvas>
    <div class="wrap post-capa__body">
      <a class="voltar link-fx" href="/arquivo.html">← Arquivo</a>
      <span class="eyebrow" data-post-cat></span>
      <h1 data-post-titulo>Carregando…</h1>
      <p class="lead" data-post-sub></p>
      <div class="post-meta" data-post-meta></div>
    </div>
  </header>

  <!-- Ficha técnica (só aparece se houver dados de filme) -->
  <section class="wrap ficha" data-ficha hidden></section>

  <!-- Corpo -->
  <section class="section">
    <div class="wrap">
      <div class="artigo" data-post-corpo></div>

      <div class="post-rodape">
        <div class="tag-row" data-post-tags></div>
        <div class="row">
          <span class="mono" style="font-size:.7rem;letter-spacing:.2em;color:var(--text-3)">COMPARTILHAR</span>
          <button class="pill" data-share="x">X</button>
          <button class="pill" data-share="wpp">WhatsApp</button>
          <button class="pill" data-share="link">Copiar link</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Relacionados -->
  <section class="section section--tight">
    <div class="wrap">
      <span class="eyebrow">Continue lendo</span>
      <h2 style="margin-bottom:36px">Da mesma editoria</h2>
      <div class="grid grid--3" data-relacionados></div>
    </div>
  </section>
</article>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__grid">
      <div>
        <h4>Newsletter</h4>
        <p style="font-size:.9rem;color:var(--text-2)">Gostou? Recebe a próxima edição por e-mail.</p>
        <form class="subscribe" data-newsletter>
          <input class="field" type="email" placeholder="seu@email.com" required aria-label="Seu e-mail">
          <button class="btn btn--solid" type="submit">Assinar</button>
        </form>
      </div>
    </div>
    <div class="footer__bottom">
      <span>© <span id="ano"></span> CINEVOLT</span>
      <span><a class="link-fx" href="/">Início</a></span>
    </div>
  </div>
</footer>

<button class="totop" aria-label="Voltar ao topo">↑</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/art.js"></script>
<script src="/assets/js/md.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/lightning.js"></script>
<script src="/assets/js/fx.js"></script>
<script src="/assets/js/post.js"></script>
</body>
</html>
