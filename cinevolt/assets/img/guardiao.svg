<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" width="640" height="960"
     role="img" aria-label="O Guardião da Tempestade — ilustração original CINEVOLT">
  <title>O Guardião da Tempestade</title>
  <defs>
    <!-- Luz de contorno fria vinda de trás -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0"   stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7df9ff"/>
      <stop offset="1"   stop-color="#7b2ff7"/>
    </linearGradient>

    <linearGradient id="corpo" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#0b0f1c"/>
      <stop offset="0.55" stop-color="#05060c"/>
      <stop offset="1"    stop-color="#0a0716"/>
    </linearGradient>

    <linearGradient id="mantoG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#3a0d2a"/>
      <stop offset="0.4" stop-color="#7a0f1e"/>
      <stop offset="1"   stop-color="#1b0410"/>
    </linearGradient>

    <radialGradient id="olho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7df9ff"/>
      <stop offset="1"   stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nucleo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bdf3ff"/>
      <stop offset="0.6"  stop-color="#00e5ff" stop-opacity=".55"/>
      <stop offset="1"    stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- TECIDO: deslocamento animado = o manto ondula sozinho -->
    <filter id="tecido" x="-25%" y="-15%" width="150%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="3" seed="7" result="ruido">
        <animate attributeName="baseFrequency"
                 dur="9s" repeatCount="indefinite"
                 values="0.006 0.014; 0.011 0.020; 0.005 0.011; 0.006 0.014"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="tecidoLeve" x="-20%" y="-15%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.018" numOctaves="2" seed="19" result="r2">
        <animate attributeName="baseFrequency"
                 dur="6.5s" repeatCount="indefinite"
                 values="0.008 0.018; 0.014 0.026; 0.008 0.018"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="r2" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowForte" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- ============ AURA TRASEIRA ============ -->
  <g id="aura">
    <ellipse cx="320" cy="430" rx="250" ry="330" fill="#00e5ff" opacity=".07" filter="url(#glowForte)"/>
    <ellipse cx="320" cy="300" rx="150" ry="180" fill="#7b2ff7" opacity=".10" filter="url(#glowForte)"/>
  </g>

  <!-- ============ MANTO (atrás do corpo) ============ -->
  <g id="manto" filter="url(#tecido)">
    <!-- aba esquerda, esvoaçando para fora do quadro -->
    <path d="M232,300
             C150,340 78,430 40,560
             C10,660 22,760 70,880
             C96,820 120,770 168,716
             C138,800 130,860 140,930
             C196,846 244,742 262,640
             C276,556 268,420 232,300 Z"
          fill="url(#mantoG)" opacity=".95"/>
    <!-- aba direita -->
    <path d="M408,300
             C486,346 556,440 588,566
             C614,668 600,772 552,890
             C528,824 502,776 458,724
             C486,806 494,864 486,932
             C428,846 384,740 370,638
             C358,552 370,418 408,300 Z"
          fill="url(#mantoG)" opacity=".88"/>
    <!-- dobras internas (mais escuras) -->
    <path d="M252,340 C214,430 208,560 236,660 C250,560 256,440 252,340 Z" fill="#12040a" opacity=".7"/>
    <path d="M392,340 C428,430 434,560 408,660 C394,560 388,440 392,340 Z" fill="#12040a" opacity=".7"/>
  </g>

  <!-- Luz fria escorrendo pelas bordas do manto -->
  <g id="mantoLuz" filter="url(#tecidoLeve)" opacity=".85">
    <path d="M232,300 C150,340 78,430 40,560 C10,660 22,760 70,880"
          fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M408,300 C486,346 556,440 588,566 C614,668 600,772 552,890"
          fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ============ CORPO ============ -->
  <g id="corpo">
    <!-- pernas -->
    <path d="M268,600 L258,930 L306,930 L318,690 L330,930 L378,930 L370,600 Z" fill="url(#corpo)"/>
    <!-- torso -->
    <path d="M240,318
             C238,290 266,268 320,268
             C374,268 402,290 400,318
             L392,470 C388,540 384,580 378,614
             L262,614 C256,580 252,540 248,470 Z"
          fill="url(#corpo)"/>
    <!-- peitoral / armadura em placas -->
    <path d="M262,340 L320,362 L378,340 L372,404 L320,424 L268,404 Z" fill="#0f1526" opacity=".95"/>
    <path d="M262,340 L320,362 L378,340" fill="none" stroke="url(#rim)" stroke-width="2" opacity=".8"/>
    <path d="M268,404 L320,424 L372,404" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity=".55"/>
    <!-- cinto -->
    <rect x="256" y="470" width="128" height="22" rx="6" fill="#0c1120"/>
    <rect x="256" y="470" width="128" height="22" rx="6" fill="none" stroke="url(#rim)" stroke-width="1.4" opacity=".7"/>
    <circle cx="320" cy="481" r="9" fill="#00e5ff" opacity=".9" filter="url(#glow)"/>

    <!-- braço esquerdo (baixo, encostado no corpo) -->
    <path d="M244,330 C214,360 200,430 206,510 C210,556 220,586 232,606
             L266,596 C252,560 244,520 244,470 C244,420 250,372 262,344 Z"
          fill="url(#corpo)"/>

    <!-- braço direito ERGUIDO segurando o martelo -->
    <path d="M396,326 C424,300 438,250 436,196 L470,186
             C480,250 466,308 430,346 Z" fill="url(#corpo)"/>
    <path d="M396,326 C424,300 438,250 436,196" fill="none" stroke="url(#rim)" stroke-width="2.4" opacity=".9"/>

    <!-- ombreiras -->
    <path d="M236,320 C244,292 276,276 320,274 C364,276 396,292 404,320
             C376,304 348,296 320,296 C292,296 264,304 236,320 Z"
          fill="#121a2e"/>
    <path d="M236,320 C244,292 276,276 320,274 C364,276 396,292 404,320"
          fill="none" stroke="url(#rim)" stroke-width="2.6"/>
  </g>

  <!-- ============ CABEÇA ============ -->
  <g id="cabeca">
    <!-- capuz -->
    <path d="M268,268 C256,200 274,150 320,140 C366,150 384,200 372,268
             C352,254 336,248 320,248 C304,248 288,254 268,268 Z"
          fill="#0a0e1a"/>
    <path d="M268,268 C256,200 274,150 320,140 C366,150 384,200 372,268"
          fill="none" stroke="url(#rim)" stroke-width="2.4"/>
    <!-- sombra do rosto -->
    <ellipse cx="320" cy="214" rx="40" ry="46" fill="#03040a"/>
    <!-- OLHOS acesos -->
    <g id="olhos">
      <ellipse cx="303" cy="210" rx="26" ry="15" fill="url(#olho)" opacity=".75"/>
      <ellipse cx="337" cy="210" rx="26" ry="15" fill="url(#olho)" opacity=".75"/>
      <ellipse cx="303" cy="210" rx="9.5" ry="4.2" fill="#ffffff" filter="url(#glow)"/>
      <ellipse cx="337" cy="210" rx="9.5" ry="4.2" fill="#ffffff" filter="url(#glow)"/>
      <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
               values="1;1;0.55;1;0.8;1;1" keyTimes="0;0.6;0.66;0.72;0.78;0.84;1"/>
    </g>
  </g>

  <!-- ============ MARTELO ============ -->
  <g id="martelo">
    <!-- cabo -->
    <rect x="456" y="180" width="18" height="120" rx="6" fill="#141a2a"
          transform="rotate(-8 465 240)"/>
    <rect x="456" y="180" width="18" height="120" rx="6" fill="none" stroke="url(#rim)"
          stroke-width="1.4" opacity=".8" transform="rotate(-8 465 240)"/>
    <!-- cabeça do martelo -->
    <g transform="rotate(-8 470 150)">
      <rect x="410" y="106" width="124" height="76" rx="10" fill="#0e1424"/>
      <rect x="410" y="106" width="124" height="76" rx="10" fill="none" stroke="url(#rim)" stroke-width="3"/>
      <rect x="424" y="122" width="96" height="44" rx="6" fill="#060a14"/>
      <path d="M436,144 L462,124 L458,142 L482,142 L456,166 L462,148 Z" fill="#7df9ff" filter="url(#glow)"/>
    </g>
    <!-- núcleo de energia -->
    <circle id="nucleoMartelo" cx="470" cy="144" r="56" fill="url(#nucleo)">
      <animate attributeName="r" dur="2.6s" repeatCount="indefinite" values="50;64;50"/>
      <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values=".75;1;.75"/>
    </circle>
  </g>

  <!-- ============ CHÃO / IMPACTO ============ -->
  <g id="base">
    <ellipse cx="320" cy="930" rx="210" ry="26" fill="#00e5ff" opacity=".16" filter="url(#glowForte)"/>
    <ellipse cx="320" cy="930" rx="96" ry="12" fill="#7df9ff" opacity=".35" filter="url(#glow)"/>
  </g>
</svg>
