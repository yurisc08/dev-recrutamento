<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Voo Rasante: desvie dos obstáculos em quatro mundos — clássico, escola de magia, mitologia grega e alta fantasia.">
<title>Voo Rasante — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
<style>
  .themes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
    width: min(100%, 340px);
  }

  .theme {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 6px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.16s, background 0.16s, transform 0.1s;
  }

  .theme:hover { background: rgba(255, 255, 255, 0.11); }
  .theme:active { transform: scale(0.97); }

  .theme[aria-pressed="true"] {
    border-color: var(--tint);
    background: color-mix(in srgb, var(--tint) 22%, transparent);
    box-shadow: 0 0 24px -8px var(--tint);
  }

  .theme .emoji { font-size: 20px; line-height: 1; }
  .theme small { color: var(--muted); font-size: 10.5px; font-weight: 400; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Jogo de voar desviando de obstáculos"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Voo Rasante</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Voo Rasante</h2>
      <p>Escolha o mundo e atravesse o máximo de passagens que conseguir. Cada mundo guarda o próprio recorde.</p>
      <div class="themes" id="themes"></div>
      <button class="btn" id="play" type="button">Voar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2>Você caiu!</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Recorde</span><b id="r-best">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <div class="row">
        <button class="btn" id="again" type="button">Voar de novo</button>
        <button class="pill" id="change" type="button">Trocar de mundo</button>
      </div>
    </div>

    <p class="hint" id="hint"><kbd>Espaço</kbd>, clique ou toque para bater as asas</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
