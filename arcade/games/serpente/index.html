<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Serpente Neon: o clássico jogo da cobrinha com visual futurista, em tela cheia.">
<title>Serpente Neon — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Jogo da cobrinha"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Serpente Neon</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Serpente Neon</h2>
      <p>Coma os núcleos de energia e cresça. Bater na parede ou no próprio corpo encerra a corrida — e quanto maior a tela, maior o tabuleiro.</p>
      <button class="btn" id="play" type="button">Começar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Fim de linha</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Tamanho</span><b id="r-len">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Jogar de novo</button>
    </div>

    <div class="touch" style="justify-content:center">
      <div class="pad" style="display:grid;grid-template-columns:repeat(3,58px);gap:8px">
        <div class="tbtn" data-key="ArrowUp" style="grid-column:2">▲</div>
        <div class="tbtn" data-key="ArrowLeft">◀</div>
        <div class="tbtn" data-key="ArrowDown">▼</div>
        <div class="tbtn" data-key="ArrowRight">▶</div>
      </div>
    </div>

    <p class="hint">Setas ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> para virar</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
