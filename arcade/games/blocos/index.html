<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Quebra-Blocos: rebata a bola e destrua a parede, fase após fase, em tela cheia.">
<title>Quebra-Blocos — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Jogo de rebater a bola e quebrar blocos"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Quebra-Blocos</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Quebra-Blocos</h2>
      <p>Mova a raquete e não deixe a bola cair. Limpe a tela para avançar de fase — a bola fica mais rápida a cada uma.</p>
      <button class="btn" id="play" type="button">Começar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Fim de jogo</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Fase</span><b id="r-level">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Jogar de novo</button>
    </div>

    <div class="touch">
      <div class="pad"><div class="tbtn" data-key="ArrowLeft">◀</div></div>
      <div class="pad"><div class="tbtn" data-key="ArrowRight">▶</div></div>
    </div>

    <p class="hint">Mova o mouse ou o dedo · <kbd>Espaço</kbd> lança a bola</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
