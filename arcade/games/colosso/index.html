<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0c10">
<meta name="description" content="Colosso: escale a torre com o gorila gigante, desvie do entulho e derrube os aviões.">
<title>Colosso — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Gorila gigante escalando uma torre"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Colosso</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Colosso</h2>
      <p>O colosso sobe sozinho. Mova-se pela face da torre para <b>desviar do entulho</b> e use o golpe para <b>derrubar os aviões</b> que se aproximam. Três vidas.</p>
      <button class="btn" id="play" type="button">Começar a escalada</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">O colosso caiu</h2>
      <div class="result">
        <div><span>Altura</span><b id="r-height">0</b></div>
        <div><span>Aviões</span><b id="r-planes">0</b></div>
        <div><span>Pontos</span><b id="r-score">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Escalar de novo</button>
    </div>

    <div class="touch">
      <div class="pad"><div class="tbtn" data-key="ArrowLeft">◀</div><div class="tbtn" data-key="ArrowRight">▶</div></div>
      <div class="pad"><div class="tbtn" data-key="Space">👊</div></div>
    </div>

    <p class="hint" id="hint"><kbd>←</kbd> <kbd>→</kbd> movem · <kbd>Espaço</kbd> golpeia</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
