<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Invasores: segure a formação alienígena o máximo que puder neste clássico de nave.">
<title>Invasores — Arcade</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
<style>
  .frame { --ar: 3 / 4; --frame-w: 520px; }
</style>
</head>
<body>
  <header class="bar">
    <a class="back" href="../../index.html">← Início</a>
    <h1>👾 Invasores</h1>
    <span class="score-chip">Recorde <b id="best">0</b></span>
    <button class="icon-btn" id="mute" type="button" aria-label="Ligar ou desligar o som">🔊</button>
  </header>

  <div class="frame">
    <canvas id="c" aria-label="Jogo de nave contra invasores"></canvas>

    <div class="screen" id="start">
      <h2>Invasores</h2>
      <p>Derrube a formação antes que ela alcance a superfície. A cada onda eles descem mais rápido.</p>
      <button class="btn" id="play" type="button">Decolar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Nave destruída</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Onda</span><b id="r-wave">1</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Tentar de novo</button>
    </div>

    <div class="touch">
      <div class="pad">
        <div class="tbtn" data-key="ArrowLeft">◀</div>
        <div class="tbtn" data-key="ArrowRight">▶</div>
      </div>
      <div class="pad"><div class="tbtn" data-key="Space">🔫</div></div>
    </div>
  </div>

  <p class="tip">
    <kbd>←</kbd> <kbd>→</kbd> movem a nave · <kbd>Espaço</kbd> atira.
    No celular, arraste o dedo para mover e toque no botão para atirar.
  </p>

  <!-- AdSense: cole aqui a tag do bloco de anúncio desta página -->
  <div class="ad-slot" data-ad="invasores-rodape"></div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
