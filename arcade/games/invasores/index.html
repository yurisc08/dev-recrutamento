<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Invasores: segure a formação alienígena onda após onda, em tela cheia.">
<title>Invasores — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Jogo de nave contra invasores"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Invasores</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Invasores</h2>
      <p>Derrube a formação antes que ela alcance a superfície. A cada onda eles descem mais rápido.</p>
      <button class="btn" id="play" type="button">Decolar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Nave destruída</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Onda</span><b id="r-wave">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Tentar de novo</button>
    </div>

    <div class="touch">
      <div class="pad"><div class="tbtn" data-key="ArrowLeft">◀</div><div class="tbtn" data-key="ArrowRight">▶</div></div>
      <div class="pad"><div class="tbtn" data-key="Space">🔫</div></div>
    </div>

    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> movem a nave · <kbd>Espaço</kbd> atira</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
