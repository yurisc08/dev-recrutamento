<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Rebatida: duelo de raquetes contra o computador, melhor de 7 pontos.">
<title>Rebatida — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Duelo de raquetes contra o computador"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Rebatida</h1>
      <span class="pill"><span class="label">Vitórias</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Rebatida</h2>
      <p>Duelo de raquetes: quem fizer <b>7 pontos</b> primeiro leva. Escolha a dificuldade.</p>
      <div class="row" id="levels"></div>
      <button class="btn" id="play" type="button">Jogar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Você venceu!</h2>
      <div class="result">
        <div><span>Você</span><b id="r-you">0</b></div>
        <div><span>CPU</span><b id="r-cpu">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Revanche</button>
    </div>

    <div class="touch">
      <div class="pad"><div class="tbtn" data-key="ArrowUp">▲</div><div class="tbtn" data-key="ArrowDown">▼</div></div>
    </div>

    <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> ou mova o mouse/dedo</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
