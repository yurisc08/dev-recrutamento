<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0c10">
<meta name="description" content="Fliperama: pinball com física de verdade — bumpers, alvos e multiplicador de combo.">
<title>Fliperama — Magicine</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="icon" href="../../icon.svg">
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Mesa de pinball"></canvas>

    <header class="hud">
      <a class="pill" href="../../index.html">← Sair</a>
      <h1>Fliperama</h1>
      <span class="pill"><span class="label">Recorde</span><b id="best">0</b></span>
      <button class="pill icon" id="mute" type="button" aria-label="Som">🔊</button>
      <button class="pill icon" id="fs" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <div class="screen" id="start">
      <h2>Fliperama</h2>
      <p>Segure <b>espaço</b> para carregar o lançador e solte. Depois use as palhetas para manter a bola viva: bumpers e alvos valem pontos, e acertos seguidos aumentam o multiplicador.</p>
      <button class="btn" id="play" type="button">Lançar</button>
    </div>

    <div class="screen hidden" id="over">
      <h2 id="over-title">Acabaram as bolas</h2>
      <div class="result">
        <div><span>Pontos</span><b id="r-score">0</b></div>
        <div><span>Recorde</span><b id="r-best">0</b></div>
      </div>
      <p class="record" id="record"></p>
      <button class="btn" id="again" type="button">Jogar de novo</button>
    </div>

    <div class="touch">
      <div class="pad"><div class="tbtn" data-key="ArrowLeft">◀</div></div>
      <div class="pad"><div class="tbtn" data-key="ArrowRight">▶</div></div>
    </div>

    <p class="hint" id="hint"><kbd>←</kbd> <kbd>→</kbd> palhetas · <kbd>Espaço</kbd> lançador</p>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
