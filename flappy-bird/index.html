<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4ec0ca">
<meta name="description" content="Flappy Bird em HTML5 Canvas - jogue no navegador, no celular ou no desktop.">
<title>Flappy Bird</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app">
    <canvas id="game" width="360" height="640" aria-label="Jogo Flappy Bird"></canvas>

    <div id="hud">
      <button id="sound-btn" type="button" aria-label="Ligar ou desligar o som">🔊</button>
    </div>

    <div id="overlay" class="screen">
      <h1>Flappy Bird</h1>
      <p class="hint">Toque na tela ou pressione <kbd>Espaço</kbd> para voar</p>
      <button id="start-btn" class="btn" type="button">Jogar</button>
      <p class="best">Recorde: <span id="menu-best">0</span></p>
    </div>

    <div id="gameover" class="screen hidden">
      <h2>Fim de jogo</h2>
      <div class="score-card">
        <div><span class="label">Pontos</span><strong id="final-score">0</strong></div>
        <div><span class="label">Recorde</span><strong id="final-best">0</strong></div>
      </div>
      <p id="medal" class="medal"></p>
      <button id="restart-btn" class="btn" type="button">Jogar de novo</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
