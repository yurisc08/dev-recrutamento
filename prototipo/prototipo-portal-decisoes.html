/* ===================================================================

  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #101315; --surface: #171b1e; --surface-2: #1f2427;
    --line: #2e3538; --line-strong: #434c50;
    --ink: #f4f7f7; --ink-2: #b5bfc3; --ink-3: #848f95;
    --accent: #3987e5; --accent-soft: #1b2b3d;
    --desligamento: #e66767; --transferencia: #3987e5; --ativo: #199e70; --estabilidade: #d95926;
    --pendente: #848f95; --alerta: #d79a1e; --alerta-bg: #2e2513; --critico-bg: #351d1d; --ok-bg: #12291f;

  }
}

  --ground: #101315; --surface: #171b1e; --surface-2: #1f2427;

<script>
(() => {
"use strict";
/* ==================================================================
   1. LEITURA DE .XLSX — ZIP + XML, sem biblioteca externa
================================================================== */
const td = new TextDecoder('utf-8');

function lerZip(buffer) {
  const dados = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let fim = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i -= 1) {
    if (dados.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  }
  if (fim < 0) throw new Error('Arquivo não parece um .xlsx válido (estrutura ZIP não encontrada).');
  const quantidade = dados.getUint16(fim + 10, true);
  let ponteiro = dados.getUint32(fim + 16, true);
  const entradas = [];
  for (let i = 0; i < quantidade; i += 1) {
    if (dados.getUint32(ponteiro, true) !== 0x02014b50) break;
    const metodo = dados.getUint16(ponteiro + 10, true);
    const tamanhoComprimido = dados.getUint32(ponteiro + 20, true);
    const tamanhoNome = dados.getUint16(ponteiro + 28, true);
    const tamanhoExtra = dados.getUint16(ponteiro + 30, true);
    const tamanhoComentario = dados.getUint16(ponteiro + 32, true);
    const deslocamento = dados.getUint32(ponteiro + 42, true);
    const nome = td.decode(bytes.subarray(ponteiro + 46, ponteiro + 46 + tamanhoNome));
    entradas.push({ nome, metodo, tamanhoComprimido, deslocamento });
    ponteiro += 46 + tamanhoNome + tamanhoExtra + tamanhoComentario;
  }
  return { bytes, dados, entradas };
}

async function extrair(zip, nome) {
  const entrada = zip.entradas.find((e) => e.nome === nome);
  if (!entrada) return null;
  const inicio = entrada.deslocamento;
  if (zip.dados.getUint32(inicio, true) !== 0x04034b50) throw new Error('Entrada corrompida: ' + nome);
  const tamanhoNome = zip.dados.getUint16(inicio + 26, true);
  const tamanhoExtra = zip.dados.getUint16(inicio + 28, true);
  const dadoInicio = inicio + 30 + tamanhoNome + tamanhoExtra;
  const bruto = zip.bytes.subarray(dadoInicio, dadoInicio + entrada.tamanhoComprimido);
  if (entrada.metodo === 0) return td.decode(bruto);
  if (typeof DecompressionStream !== 'function') {
    throw new Error('Este navegador não consegue descompactar o arquivo. Use Chrome ou Edge atualizados.');
  }
  const fluxo = new Blob([bruto]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return td.decode(await new Response(fluxo).arrayBuffer());
}

const letrasParaIndice = (referencia) => {
  const letras = (referencia.match(/^[A-Z]+/) || ['A'])[0];
  let indice = 0;
  for (let i = 0; i < letras.length; i += 1) indice = indice * 26 + (letras.charCodeAt(i) - 64);
  return indice;
};

const serialParaISO = (numero) => {
  const ms = Math.round((Number(numero) - 25569) * 86400 * 1000);
  const data = new Date(ms);
  return Number.isNaN(data.getTime()) ? String(numero) : data.toISOString().slice(0, 10);
};

/** Lê a planilha e devolve { abas: [{nome, linhas}] } com as células já em texto. */
async function lerPlanilha(arquivo) {
  const zip = lerZip(await arquivo.arrayBuffer());
  const parser = new DOMParser();
  const workbook = parser.parseFromString(await extrair(zip, 'xl/workbook.xml'), 'application/xml');
  const rels = parser.parseFromString(await extrair(zip, 'xl/_rels/workbook.xml.rels'), 'application/xml');

  const alvos = {};
  rels.querySelectorAll('Relationship').forEach((r) => { alvos[r.getAttribute('Id')] = r.getAttribute('Target'); });

  // textos compartilhados
  const compartilhados = [];
  const sstXml = await extrair(zip, 'xl/sharedStrings.xml');
  if (sstXml) {
    parser.parseFromString(sstXml, 'application/xml').querySelectorAll('si').forEach((si) => {
      compartilhados.push([...si.querySelectorAll('t')].map((t) => t.textContent).join(''));
    });
  }

  // estilos: descobre quais formatos são data
  const estiloEhData = [];
  const estilosXml = await extrair(zip, 'xl/styles.xml');
  if (estilosXml) {
    const doc = parser.parseFromString(estilosXml, 'application/xml');
    const formatos = {};
    doc.querySelectorAll('numFmt').forEach((f) => { formatos[f.getAttribute('numFmtId')] = f.getAttribute('formatCode') || ''; });
    const embutidosData = ['14','15','16','17','18','19','20','21','22','45','46','47'];
    const xfs = doc.querySelector('cellXfs');
    if (xfs) {
      [...xfs.querySelectorAll('xf')].forEach((xf, indice) => {
        const id = xf.getAttribute('numFmtId') || '0';
        const codigo = formatos[id] || '';
        estiloEhData[indice] = embutidosData.includes(id) || /[dmy]/i.test(codigo.replace(/\[[^\]]*\]/g, '')) && /[dy]/i.test(codigo);
      });
    }
  }

  const abas = [];
  const folhas = [...workbook.querySelectorAll('sheets > sheet')];
  for (const folha of folhas) {
    const id = folha.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')
      || folha.getAttribute('r:id');
    let alvo = alvos[id] || '';
    if (alvo.startsWith('/')) alvo = alvo.slice(1); else alvo = 'xl/' + alvo.replace(/^\.\//, '');
    const xml = await extrair(zip, alvo);
    if (!xml) continue;
    const doc = parser.parseFromString(xml, 'application/xml');
    const linhas = [];
    doc.querySelectorAll('sheetData > row').forEach((row) => {
      const numero = Number(row.getAttribute('r') || linhas.length + 1);
      const celulas = [];
      row.querySelectorAll('c').forEach((c) => {
        const indice = letrasParaIndice(c.getAttribute('r') || 'A1') - 1;
        const tipo = c.getAttribute('t');
        let valor = '';
        if (tipo === 's') {
          valor = compartilhados[Number(c.querySelector('v') ? c.querySelector('v').textContent : -1)] || '';
        } else if (tipo === 'inlineStr') {
          valor = [...c.querySelectorAll('is t')].map((t) => t.textContent).join('');
        } else {
          const v = c.querySelector('v');
          valor = v ? v.textContent : '';
          const estilo = Number(c.getAttribute('s') || -1);
          if (valor !== '' && estiloEhData[estilo] && !Number.isNaN(Number(valor))) valor = serialParaISO(valor);
        }
        celulas[indice] = valor == null ? '' : String(valor);
      });
      linhas[numero - 1] = celulas;
    });
    abas.push({ nome: folha.getAttribute('name'), linhas: linhas.filter(Boolean) });
  }
  return { abas };
}

/* ==================================================================
   2. GRAVAÇÃO DE .XLSX — ZIP sem compressão (aceito pelo Excel)
================================================================== */
const te = new TextEncoder();
const TABELA_CRC = (() => {
  const tabela = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) {
    let c = i;
    for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tabela[i] = c >>> 0;
  }
  return tabela;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i += 1) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function montarZip(arquivos) {
  const partes = [];
  const central = [];
  let deslocamento = 0;
  arquivos.forEach((arquivo) => {
    const nome = te.encode(arquivo.nome);
    const conteudo = te.encode(arquivo.conteudo);
    const crc = crc32(conteudo);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0, true);
    local.setUint16(8, 0, true); local.setUint16(10, 0, true); local.setUint16(12, 0, true);
    local.setUint32(14, crc, true); local.setUint32(18, conteudo.length, true); local.setUint32(22, conteudo.length, true);
    local.setUint16(26, nome.length, true); local.setUint16(28, 0, true);
    partes.push(new Uint8Array(local.buffer), nome, conteudo);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true); cd.setUint16(10, 0, true); cd.setUint16(12, 0, true); cd.setUint16(14, 0, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, conteudo.length, true); cd.setUint32(24, conteudo.length, true);
    cd.setUint16(28, nome.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true);
    cd.setUint32(42, deslocamento, true);
    central.push(new Uint8Array(cd.buffer), nome);
    deslocamento += 30 + nome.length + conteudo.length;
  });

  const tamanhoCentral = central.reduce((soma, parte) => soma + parte.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
  fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamanhoCentral, true); fim.setUint32(16, deslocamento, true); fim.setUint16(20, 0, true);

  return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
}

const xmlEscapar = (texto) => String(texto == null ? '' : texto)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function colunaLetra(indice) {
  let letra = '';
  let n = indice;
  while (n > 0) { const resto = (n - 1) % 26; letra = String.fromCharCode(65 + resto) + letra; n = Math.floor((n - resto) / 26); }
  return letra;
}

/** Monta uma aba: linhas de células (texto ou número) + validação opcional na coluna da ação. */
function abaXml(linhas, opcoes) {
  const corpo = linhas.map((celulas, indiceLinha) => {
    const numero = indiceLinha + 1;
    const conteudo = celulas.map((celula, indiceColuna) => {
      if (celula == null || celula === '') return '';
      const referencia = colunaLetra(indiceColuna + 1) + numero;
      const estilo = numero === 1 ? ' s="1"' : '';
      if (typeof celula === 'number') return '<c r="' + referencia + '"' + estilo + '><v>' + celula + '</v></c>';
      return '<c r="' + referencia + '" t="inlineStr"' + estilo + '><is><t xml:space="preserve">' + xmlEscapar(celula) + '</t></is></c>';
    }).join('');
    return '<row r="' + numero + '">' + conteudo + '</row>';
  }).join('');

  let validacao = '';
  if (opcoes && opcoes.colunaLista && opcoes.opcoesLista && opcoes.opcoesLista.length) {
    const letra = colunaLetra(opcoes.colunaLista);
    validacao = '<dataValidations count="1"><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1"'
      + ' errorTitle="Opção inválida" error="Escolha uma das opções da lista." sqref="' + letra + '2:' + letra + Math.max(linhas.length, 2) + '">'
      + '<formula1>"' + xmlEscapar(opcoes.opcoesLista.join(',')) + '"</formula1></dataValidation></dataValidations>';
  }

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetData>' + corpo + '</sheetData>' + validacao + '</worksheet>';
}

      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + '</Types>' },

      + '<sheets>' + abas.map((aba, i) => '<sheet name="' + xmlEscapar(aba.nome) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets>'
      + '</workbook>' },
    { nome: 'xl/_rels/workbook.xml.rels', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + abas.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('')
      + '<Relationship Id="rId' + (abas.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>' },
    { nome: 'xl/styles.xml', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'
      + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
      + '<fill><patternFill patternType="solid"><fgColor rgb="FF1C5CAB"/><bgColor indexed="64"/></patternFill></fill></fills>'
      + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
      + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
      + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'
      + '</styleSheet>' }
  ];
  abas.forEach((aba, i) => {
    arquivos.push({ nome: 'xl/worksheets/sheet' + (i + 1) + '.xml', conteudo: abaXml(aba.linhas, aba.opcoes) });
  });
  return montarZip(arquivos);
}

function baixar(blob, nome) {
  const url = URL.createObjectURL(blob);

  link.href = url;
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const escapar = (t) => String(t == null ? '' : t)

const fmtNumero = (n) => Number(n || 0).toLocaleString('pt-BR');

const fmtData = (v) => {
  const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(v || '');
};
const numeroDe = (v) => {
  if (v == null || v === '') return 0;
  let t = String(v).replace(/[R$\s ]/gi, '');
  if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = Number(t);
  return Number.isFinite(n) ? n : 0;
};

  if (!valores.acao) return null;
  const info = acaoInfo(valores.acao);
  const alertaExige = alertasDe(linha).some((a) => a.exigeJustificativa && (!a.acao || a.acao === valores.acao));
  if (((info && info.exigeJustificativa) || alertaExige) && !String(valores.justificativa || '').trim()) return 'justificativa';
  if (info && info.exigeDestino && !String(valores.destino || '').trim()) return 'destino';
  return null;
}

function auditar(evento) {
  const usuario = usuarioAtual();
  estado.auditoria.unshift(Object.assign({
    quando: new Date().toISOString(),
    usuario: usuario ? usuario.nome : 'sistema',
    perfil: usuario ? usuario.perfil : ''
  }, evento));
  if (estado.auditoria.length > 4000) estado.auditoria.length = 4000;
}

function gravarDecisao(linha, valores, silencioso) {
  const chapa = campo(linha, 'chapa');
  const anterior = decisaoDe(chapa);
  const usuario = usuarioAtual();
  estado.decisoes[chapa] = {
    acao: valores.acao || '',
    justificativa: valores.justificativa || '',
    destino: valores.destino || '',
    status: valores.acao ? (anterior.status === 'homologada' ? 'homologada' : 'preenchida') : 'pendente',
    por: usuario ? usuario.nome : '',
    em: new Date().toISOString(),
    homologadoPor: anterior.homologadoPor || '',
    homologadoEm: anterior.homologadoEm || ''
  };
  delete estado.rascunhos[chapa];
  if ((anterior.acao || '') !== (valores.acao || '')) {
    auditar({ tipo: 'Avaliação', chapa: chapa, colaborador: campo(linha, 'nome'), campo: 'ação',
      de: anterior.acao || 'Sem decisão', para: valores.acao || 'Sem decisão' });
  }
  if ((anterior.justificativa || '') !== (valores.justificativa || '')) {
    auditar({ tipo: 'Avaliação', chapa: chapa, colaborador: campo(linha, 'nome'), campo: 'justificativa',
      de: anterior.justificativa || '—', para: valores.justificativa || '—' });
  }
  if ((anterior.destino || '') !== (valores.destino || '')) {
    auditar({ tipo: 'Avaliação', chapa: chapa, colaborador: campo(linha, 'nome'), campo: 'destino',
      de: anterior.destino || '—', para: valores.destino || '—' });
  }
  salvar();
  if (!silencioso) toast('Decisão registrada.');
}

function podeEditar(linha) {
  const usuario = usuarioAtual();
  if (!usuario) return false;
  const decisao = decisaoDe(campo(linha, 'chapa'));
  if (usuario.perfil === 'gestor' && decisao.status === 'homologada') return false;
  return true;
}

function entrar(login, senha) {
  const usuario = estado.usuarios.find((u) => u.usuario === login);
  if (!usuario || !usuario.ativo) return 'Usuário ou senha inválidos.';
  tentativas[login] = tentativas[login] || 0;
  if (tentativas[login] >= 5) return 'Muitas tentativas. Aguarde alguns minutos ou procure o RH.';
  if (usuario.senha !== senha) {
    tentativas[login] += 1;
    auditar({ tipo: 'Login (falha)', chapa: '', colaborador: '', campo: 'usuário', de: '', para: login });
    salvar();
    return 'Usuário ou senha inválidos.';
  }
  tentativas[login] = 0;
  estado.sessao = login;
  estado.tela = 'painel';
  filtros = {};
  selecao = [];
  auditar({ tipo: 'Login', chapa: '', colaborador: '', campo: '', de: '', para: usuario.nome });
  salvar();
  return null;
}

function calcular(lista) {
  const total = lista.length;
  const desligados = lista.filter((l) => normalizar(campo(l, 'situacao')) === 'desligado').length;
  const avaliados = lista.filter((l) => decisaoDe(campo(l, 'chapa')).acao).length;
  const homologadas = lista.filter((l) => decisaoDe(campo(l, 'chapa')).status === 'homologada').length;
  const comAlerta = lista.filter((l) => alertasDe(l).some((a) => a.severidade !== 'info')).length;
  const custo = lista.reduce((s, l) => s + numeroDe(campo(l, 'custo')), 0);
  const reducao = lista.filter((l) => {
    const info = acaoInfo(decisaoDe(campo(l, 'chapa')).acao);
    return info && info.reducao;
  }).reduce((s, l) => s + numeroDe(campo(l, 'custo')), 0);
  const porAcao = estado.acoes.filter((a) => a.ativo).map((a) => ({
    rotulo: a.valor, cor: a.cor,
    total: lista.filter((l) => decisaoDe(campo(l, 'chapa')).acao === a.valor).length
  })).concat([{ rotulo: 'Sem decisão', cor: 'pendente', total: total - avaliados }]);
  return { total, desligados, avaliados, pendentes: total - avaliados, homologadas, comAlerta, custo, reducao, porAcao };
}

function agrupar(lista, chave) {
  const mapa = new Map();
  lista.forEach((l) => {
    const nome = campo(l, chave) || '(não informado)';
    const item = mapa.get(nome) || { total: 0, avaliados: 0, desligamentos: 0, transferencias: 0, homologadas: 0 };
    item.total += 1;
    const decisao = decisaoDe(campo(l, 'chapa'));
    if (decisao.acao) item.avaliados += 1;
    if (decisao.status === 'homologada') item.homologadas += 1;
    const info = acaoInfo(decisao.acao);
    if (info && info.reducao) item.desligamentos += 1;
    if (info && info.exigeDestino) item.transferencias += 1;
    mapa.set(nome, item);
  });
  return [...mapa.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

    + '<th class="num">Transferências</th><th class="num">Homologadas</th><th class="num">% concluído</th></tr></thead><tbody>'
    + linhas.map(([nome, l]) => '<tr><td>' + escapar(nome) + '</td><td class="num">' + l.total + '</td>'

      + '<td class="num">' + l.desligamentos + '</td><td class="num">' + l.transferencias + '</td>'
      + '<td class="num">' + l.homologadas + '</td>'
      + '<td class="num">' + (l.total ? Math.round((l.avaliados / l.total) * 100) : 0) + '%</td></tr>').join('')
    + '</tbody></table></div></div>';

  let html = '<div class="bloco"><div class="kpis">'
    + kpis.map((k) => '<div class="kpi' + (k.destaque ? ' destaque' : '') + '"><div class="rot">' + k.rot + '</div>'
      + '<div class="val">' + k.val + '</div><div class="nota">' + k.nota + '</div>'

      + '</div>').join('')
    + '</div></div>'
    + '<div class="bloco"><div class="bloco-cab"><h2>Distribuição por ação indicada</h2></div>'

  if (usuario.perfil === 'admin') html += tabela('Andamento por Diretoria', 'visão da empresa toda', agrupar(lista, 'diretoria'), 'Diretoria');
  html += tabela('Andamento por Divisão', usuario.perfil === 'gestor' ? '' : 'percentual de conclusão de cada Divisão',
    agrupar(lista, 'divisao'), 'Divisão');

  if (usuario.perfil !== 'gestor') {

        + [...porGestor.entries()].map(([nome, l]) => '<tr><td>' + escapar(nome) + '</td>'
          + '<td class="num">' + l.total + '</td><td class="num">' + l.avaliados + '</td>'

          + (l.total - l.avaliados) + '</td></tr>').join('')

  return html;

function listaFiltrada() {
  let lista = visiveis();
  if (estado.tela === 'avaliacoes' && filtros.status === undefined) filtros.status = 'pendente';
  if (filtros.busca) {
    const termo = normalizar(filtros.busca);
    lista = lista.filter((l) => normalizar(campo(l, 'nome') + ' ' + campo(l, 'chapa') + ' ' + campo(l, 'cargo')).includes(termo));
  }
  if (filtros.diretoria) lista = lista.filter((l) => campo(l, 'diretoria') === filtros.diretoria);
  if (filtros.divisao) lista = lista.filter((l) => campo(l, 'divisao') === filtros.divisao);
  if (filtros.gestor) {
    const gestor = estado.usuarios.find((u) => u.usuario === filtros.gestor);
    lista = gestor ? lista.filter((l) => gestor.divisoes.includes(campo(l, 'divisao'))) : lista;
  }
  if (filtros.acao) {
    lista = filtros.acao === '__sem__'
      ? lista.filter((l) => !decisaoDe(campo(l, 'chapa')).acao)
      : lista.filter((l) => decisaoDe(campo(l, 'chapa')).acao === filtros.acao);
  }
  if (filtros.status) lista = lista.filter((l) => decisaoDe(campo(l, 'chapa')).status === filtros.status);
  if (filtros.alerta) lista = lista.filter((l) => alertasDe(l).some((a) => a.severidade !== 'info'));
  return lista;
}

    + '<span class="espaco"></span>'

    + '<button class="btn" data-acao-menu="exportar" type="button">Exportar Excel</button>'
    + '</div></div></div>';

  if (selecao.length) {
    html += '<div class="barra-selecao"><b>' + selecao.length + '</b> selecionado(s)<span class="espaco"></span>'
      + '<button class="btn pequeno" id="btn-limpar-selecao" type="button">Limpar seleção</button>'
      + '<button class="btn pequeno primario" id="btn-lote" type="button">Aplicar ação aos selecionados</button>'
      + (podeHomologar ? '<button class="btn pequeno" id="btn-homologar" type="button">Homologar selecionados</button>' : '')
      + '</div>';
  }

  html += '<div class="tabela-caixa rolagem"><table><thead><tr>'
    + '<th style="width:32px"><input type="checkbox" id="marcar-todos"></th>'
    + '<th>Matrícula</th><th>Nome</th><th>Cargo</th><th>Divisão</th>'
    + '<th style="min-width:235px">Ação indicada</th><th style="min-width:250px">Justificativa</th><th>Status</th>'
    + '<th class="num">Salário anual</th><th>Performar</th><th>Estabilidade</th><th></th></tr></thead><tbody>';

  if (!lista.length) html += '<tr><td class="vazio" colspan="12">Nenhum colaborador com os filtros atuais.</td></tr>';

  lista.forEach((linha) => {
    const chapa = campo(linha, 'chapa');
    const decisao = decisaoDe(chapa);
    const atual = valorDe(chapa);
    const info = acaoInfo(atual.acao);
    const alertas = alertasDe(linha);
    const graves = alertas.filter((a) => a.severidade !== 'info');
    const falta = faltando(linha, atual);
    const editavel = podeEditar(linha);
    const marcada = selecao.includes(chapa);
    const indice = estado.base.indexOf(linha);

    html += '<tr' + (marcada ? ' class="marcada"' : '') + '>'
      + '<td><input type="checkbox" data-marcar="' + escapar(chapa) + '"' + (marcada ? ' checked' : '') + '></td>'
      + '<td class="chapa">' + escapar(chapa) + '</td>'
      + '<td><button class="btn texto" data-ficha="' + indice + '">' + escapar(campo(linha, 'nome')) + '</button></td>'
      + '<td class="limite" style="color:var(--ink-2)">' + escapar(campo(linha, 'cargo')) + '</td>'
      + '<td class="limite" style="color:var(--ink-2)">' + escapar(campo(linha, 'divisao').replace('DIVISAO ', '')) + '</td>';

    if (editavel) {
      html += '<td><select class="decisao' + (atual.acao ? ' preenchida' : '') + (falta === 'justificativa' ? ' exigida' : '') + '" data-acao="' + indice + '">'
        + '<option value="">— sem decisão —</option>'
        + estado.acoes.filter((a) => a.ativo).map((a) => '<option value="' + escapar(a.valor) + '"'
          + (atual.acao === a.valor ? ' selected' : '') + '>' + escapar(a.valor) + '</option>').join('')
        + '</select>'
        + (falta ? '<div class="falta">' + (falta === 'destino' ? 'Informe o destino para gravar.' : 'Informe a justificativa para gravar.') + '</div>' : '')
        + (info && info.exigeDestino ? '<input class="decisao' + (falta === 'destino' ? ' exigida' : '') + '" data-destino="' + indice
          + '" value="' + escapar(atual.destino) + '" placeholder="Destino: Diretoria / setor / nº processo">' : '')
        + '</td>'
        + '<td><input class="decisao' + (falta === 'justificativa' ? ' exigida' : '') + '" data-justificativa="' + indice
        + '" value="' + escapar(atual.justificativa) + '" placeholder="'
        + (info && info.exigeJustificativa ? 'Justificativa obrigatória para esta ação' : 'Justificativa (opcional)') + '"></td>';
    } else {
      html += '<td><span class="pill ' + (info ? info.cor : '') + '">' + escapar(decisao.acao || 'Sem decisão') + '</span></td>'
        + '<td class="limite" style="color:var(--ink-2)">' + escapar(decisao.justificativa) + '</td>';
    }

    html += '<td><span class="pill ' + (decisao.status === 'homologada' ? 'homologada' : decisao.status === 'preenchida' ? 'ativo' : '') + '">'
      + (decisao.status === 'homologada' ? 'Homologada' : decisao.status === 'preenchida' ? 'Preenchida' : 'Pendente') + '</span>'
      + (graves.length ? '<span class="marca-alerta" title="' + escapar(graves.map((a) => a.mensagem).join(' ')) + '">⚠</span>' : '') + '</td>'
      + '<td class="num">' + fmtMoeda(numeroDe(campo(linha, 'custo'))) + '</td>'
      + '<td class="limite" style="color:var(--ink-2)">' + escapar(linha['DATA E NOTA ÚLTIMA AVALIAÇÃO PERFORMAR REGISTRADA'] || '') + '</td>'
      + '<td style="color:var(--ink-2)">' + escapar(campo(linha, 'estabilidade') || '—') + '</td>'
      + '<td><button class="btn pequeno" data-ficha="' + indice + '">Detalhes</button></td></tr>';
  });

  html += '</tbody></table></div>'
    + '<p style="font-size:12.5px;color:var(--ink-3);margin:10px 2px 0">' + fmtNumero(lista.length) + ' de '
    + fmtNumero(visiveis().length) + ' colaborador(es) no seu acesso · marque a decisão direto na linha — grava na hora e entra na auditoria.</p>';
  return html;
}

function ligarLista() {
  const raiz = document.getElementById('raiz');

  const filtro = (id, chave, tipo) => {
    const alvo = document.getElementById(id);
    if (!alvo) return;
    alvo.addEventListener(tipo === 'texto' ? 'input' : 'change', () => {
      filtros[chave] = tipo === 'marcar' ? alvo.checked : alvo.value;
      const tinhaFoco = document.activeElement === alvo;
      desenhar();
      if (tinhaFoco) {
        const novo = document.getElementById(id);
        if (novo) { novo.focus(); if (tipo === 'texto' && novo.setSelectionRange) novo.setSelectionRange(novo.value.length, novo.value.length); }
      }
    });
  };
  filtro('f-busca', 'busca', 'texto');
  filtro('f-diretoria', 'diretoria');
  filtro('f-divisao', 'divisao');
  filtro('f-gestor', 'gestor');
  filtro('f-status', 'status');
  filtro('f-acao', 'acao');
  filtro('f-alerta', 'alerta', 'marcar');

  const limpar = document.getElementById('btn-limpar');
  if (limpar) limpar.addEventListener('click', () => { filtros = { status: '' }; desenhar(); });

  raiz.querySelectorAll('[data-acao]').forEach((seletor) => {
    seletor.addEventListener('change', () => {
      const linha = estado.base[Number(seletor.dataset.acao)];
      const atual = valorDe(campo(linha, 'chapa'));
      const valores = { acao: seletor.value, justificativa: atual.justificativa, destino: atual.destino };
      const falta = faltando(linha, valores);
      if (falta) {
        estado.rascunhos[campo(linha, 'chapa')] = valores;
        salvar();
        desenhar();
        const alvo = document.querySelector(falta === 'destino'
          ? '[data-destino="' + seletor.dataset.acao + '"]' : '[data-justificativa="' + seletor.dataset.acao + '"]');
        if (alvo) alvo.focus();
        toast(falta === 'destino' ? 'Informe o destino para gravar esta transferência.' : 'Esta ação exige justificativa.', 'erro');
        return;
      }
      gravarDecisao(linha, valores);
      desenhar();
    });
  });

  const ligarTexto = (seletor, chave) => {
    raiz.querySelectorAll(seletor).forEach((entrada) => {
      entrada.addEventListener('change', () => {
        const indice = Number(entrada.dataset.justificativa || entrada.dataset.destino);
        const linha = estado.base[indice];
        const atual = valorDe(campo(linha, 'chapa'));
        const valores = { acao: atual.acao, justificativa: atual.justificativa, destino: atual.destino };
        valores[chave] = entrada.value;
        const falta = faltando(linha, valores);
        if (falta) {
          estado.rascunhos[campo(linha, 'chapa')] = valores;
          salvar();
          desenhar();
          const proximo = document.querySelector(falta === 'destino'
            ? '[data-destino="' + indice + '"]' : '[data-justificativa="' + indice + '"]');
          if (proximo) proximo.focus();
          return;
        }
        gravarDecisao(linha, valores);
        desenhar();
      });
    });
  };
  ligarTexto('[data-justificativa]', 'justificativa');
  ligarTexto('[data-destino]', 'destino');

  raiz.querySelectorAll('[data-marcar]').forEach((caixa) => {
    caixa.addEventListener('change', () => {
      const chapa = caixa.dataset.marcar;
      selecao = caixa.checked ? selecao.concat([chapa]) : selecao.filter((c) => c !== chapa);
      desenhar();
    });
  });
  const todos = document.getElementById('marcar-todos');
  if (todos) todos.addEventListener('change', () => {
    selecao = todos.checked ? listaFiltrada().map((l) => campo(l, 'chapa')) : [];
    desenhar();
  });
  const limparSelecao = document.getElementById('btn-limpar-selecao');
  if (limparSelecao) limparSelecao.addEventListener('click', () => { selecao = []; desenhar(); });
  const lote = document.getElementById('btn-lote');
  if (lote) lote.addEventListener('click', abrirLote);

  const homologar = document.getElementById('btn-homologar');
  if (homologar) homologar.addEventListener('click', () => {
    let aplicadas = 0;
    const semAcao = [];
    selecao.forEach((chapa) => {
      const linha = estado.base.find((l) => campo(l, 'chapa') === chapa);
      const decisao = decisaoDe(chapa);
      if (!decisao.acao) { semAcao.push(chapa); return; }
      const usuario = usuarioAtual();
      estado.decisoes[chapa] = Object.assign({}, decisao, {
        status: 'homologada', homologadoPor: usuario.nome, homologadoEm: new Date().toISOString()
      });
      auditar({ tipo: 'Homologação', chapa: chapa, colaborador: campo(linha, 'nome'), campo: 'status',
        de: decisao.status, para: 'homologada' });
      aplicadas += 1;
    });
    selecao = [];
    salvar();
    desenhar();
    toast(aplicadas + ' homologada(s)' + (semAcao.length ? ' · ' + semAcao.length + ' sem ação indicada foram puladas' : '') + '.',
      semAcao.length ? 'erro' : undefined);
  });

  raiz.querySelectorAll('[data-ficha]').forEach((botao) => {
    botao.addEventListener('click', () => abrirFicha(Number(botao.dataset.ficha)));
  });
}

/* ------------------------------- ficha -------------------------------- */
function abrirFicha(indice) {
  const linha = estado.base[indice];
  const chapa = campo(linha, 'chapa');
  const decisao = decisaoDe(chapa);
  const alertas = alertasDe(linha);
  const historico = estado.auditoria.filter((e) => e.chapa === chapa);
  const dlg = document.getElementById('dlg');

  dlg.innerHTML = '<div class="dlg-topo"><h3>' + escapar(campo(linha, 'nome')) + ' · matrícula ' + escapar(chapa) + '</h3>'
    + '<button class="btn pequeno" data-fechar type="button">Fechar</button></div><div class="dlg-corpo">'
    + (alertas.length ? '<div class="avisos" style="margin-bottom:16px">' + alertas.map((a) => '<div class="aviso '
      + (a.severidade === 'critico' ? 'critico' : a.severidade === 'atencao' ? 'atencao' : 'info') + '">' + escapar(a.mensagem) + '</div>').join('') + '</div>' : '')
    + '<div class="cartao cartao-pad" style="margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:10px">Decisão registrada no portal</h3>'
    + '<div class="ficha">'
    + '<div><div class="rot">Ação indicada</div><div>' + (decisao.acao
      ? '<span class="pill ' + ((acaoInfo(decisao.acao) || {}).cor || '') + '">' + escapar(decisao.acao) + '</span>'
      : '<span class="pill">Sem decisão</span>') + '</div></div>'
    + '<div><div class="rot">Status</div><div>' + (decisao.status === 'homologada' ? 'Homologada' : decisao.status === 'preenchida' ? 'Preenchida' : 'Pendente') + '</div></div>'
    + '<div><div class="rot">Destino</div><div>' + (escapar(decisao.destino) || '—') + '</div></div>'
    + '<div><div class="rot">Preenchido por</div><div>' + (escapar(decisao.por) || '—') + (decisao.em ? ' · ' + fmtDataHora(decisao.em) : '') + '</div></div>'
    + (decisao.homologadoPor ? '<div><div class="rot">Homologado por</div><div>' + escapar(decisao.homologadoPor)
      + ' · ' + fmtDataHora(decisao.homologadoEm) + '</div></div>' : '')
    + '</div><div style="margin-top:12px"><div class="rot" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600">Justificativa</div>'
    + '<div>' + (escapar(decisao.justificativa) || '—') + '</div></div></div>'
    + '<h3 style="font-size:14px;margin-bottom:10px">Dados da base <span style="font-weight:400;color:var(--ink-3);font-size:12px">— vindos da planilha</span></h3>'
    + '<div class="ficha">' + estado.cabecalhos.map((c) => '<div><div class="rot">' + escapar(c) + '</div><div>'
      + (escapar(linha[c]) || '—') + '</div></div>').join('') + '</div>'
    + (historico.length ? '<div class="grupo-titulo">Histórico deste colaborador</div><ul class="linha-tempo">'
      + historico.slice(0, 20).map((e) => '<li><div>' + escapar(e.campo) + ': “' + escapar(e.de) + '” → “' + escapar(e.para) + '”</div>'
        + '<div class="quando">' + escapar(e.usuario) + ' · ' + fmtDataHora(e.quando) + '</div></li>').join('') + '</ul>' : '')
    + '</div><div class="dlg-rodape"><button class="btn primario" data-fechar type="button">Fechar</button></div>';
  dlg.querySelectorAll('[data-fechar]').forEach((b) => b.addEventListener('click', () => dlg.close()));
  dlg.showModal();
}

/* -------------------------------- lote -------------------------------- */
function abrirLote() {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '<div class="dlg-topo"><h3>Aplicar ação a ' + selecao.length + ' colaborador(es)</h3>'
    + '<button class="btn pequeno" data-fechar type="button">Fechar</button></div><div class="dlg-corpo">'
    + '<p style="color:var(--ink-2);font-size:13px">A mesma ação e justificativa vão para os selecionados. Quem exigir destino '
    + 'específico ou tiver alerta de estabilidade volta na lista de pendências, para tratamento individual.</p>'
    + '<div class="campo"><label for="lote-acao">Ação indicada</label><select id="lote-acao"><option value="">Sem decisão</option>'
    + estado.acoes.filter((a) => a.ativo).map((a) => '<option value="' + escapar(a.valor) + '">' + escapar(a.valor) + '</option>').join('')
    + '</select></div>'
    + '<div class="campo" style="margin-top:12px"><label for="lote-just">Justificativa</label>'
    + '<textarea id="lote-just" rows="3" placeholder="Critérios considerados: cultura, desempenho, custo x entrega, polivalência, impacto na continuidade..."></textarea></div>'
    + '<div id="lote-resultado" style="margin-top:14px"></div></div>'
    + '<div class="dlg-rodape"><button class="btn" data-fechar type="button">Cancelar</button>'
    + '<button class="btn primario" id="lote-aplicar" type="button">Aplicar a todos</button></div>';

  dlg.querySelectorAll('[data-fechar]').forEach((b) => b.addEventListener('click', () => { dlg.close(); desenhar(); }));
  dlg.querySelector('#lote-aplicar').addEventListener('click', () => {
    const acao = dlg.querySelector('#lote-acao').value;
    const justificativa = dlg.querySelector('#lote-just').value;
    const pendencias = [];
    let aplicadas = 0;
    selecao.forEach((chapa) => {
      const linha = estado.base.find((l) => campo(l, 'chapa') === chapa);
      if (!linha || !podeEditar(linha)) {
        if (linha) pendencias.push({ chapa: chapa, nome: campo(linha, 'nome'), motivo: 'já homologada' });
        return;
      }
      const valores = { acao: acao, justificativa: justificativa, destino: valorDe(chapa).destino };
      const falta = faltando(linha, valores);
      if (falta) {
        pendencias.push({ chapa: chapa, nome: campo(linha, 'nome'),
          motivo: falta === 'destino' ? 'exige destino específico' : 'exige justificativa (alerta do RH ou regra da ação)' });
        return;
      }
      gravarDecisao(linha, valores, true);
      aplicadas += 1;
    });
    salvar();
    dlg.querySelector('#lote-resultado').innerHTML = '<div class="aviso ' + (pendencias.length ? 'atencao' : 'ok') + '">'
      + aplicadas + ' gravada(s)' + (pendencias.length ? ' · ' + pendencias.length + ' exigem tratamento individual' : '') + '.</div>'
      + (pendencias.length ? '<ul style="font-size:12.5px;color:var(--ink-2);margin-top:8px">'
        + pendencias.map((p) => '<li><b>' + escapar(p.chapa) + '</b> ' + escapar(p.nome) + ' — ' + p.motivo + '</li>').join('') + '</ul>' : '');
    if (!pendencias.length) { selecao = []; setTimeout(() => { dlg.close(); desenhar(); }, 800); }
  });
  dlg.showModal();
}

function telaImportar() {
  const passo = importacao ? importacao.passo : 1;
  const marca = (n, rotulo) => '<span class="passo-marca' + (passo === n ? ' atual' : passo > n ? ' feito' : '') + '">'
    + (passo > n ? '✓' : n) + ' ' + rotulo + '</span>';

  let html = '<div class="passos-import">' + marca(1, 'Arquivo') + marca(2, 'Conferir colunas') + marca(3, 'Prévia da carga') + '</div>';

  if (passo === 1) {
    html += '<div class="bloco cartao cartao-pad">'
      + '<h2 style="font-size:16px;margin-bottom:6px">Carregar a base</h2>'
      + '<p style="color:var(--ink-2);margin:0 0 14px">Nada é gravado antes da sua confirmação. A chave de atualização é a '
      + '<b>matrícula (CHAPA)</b>: matrículas novas entram, existentes são atualizadas, e as decisões já preenchidas no portal são preservadas.</p>'
      + '<div class="linha">'
      + '<div class="campo" style="flex:2"><label for="arquivo">Planilha .xlsx</label><input id="arquivo" type="file" accept=".xlsx,.xlsm"></div>'
      + '<button class="btn" id="btn-exemplo" type="button">Usar base de exemplo (96 colaboradores fictícios)</button>'
      + '</div></div>';
    if (estado.base.length) {
      html += '<div class="bloco"><div class="aviso info">Já existe base carregada: <b>' + fmtNumero(estado.base.length)
        + '</b> colaboradores (' + escapar(estado.origemBase) + '). Uma nova carga atualiza os registros pela matrícula.</div></div>';
    }
  }

  if (passo === 2) {
    const chaves = [
      ['chapa', 'Matrícula (chave)', true], ['nome', 'Nome', true], ['diretoria', 'Diretoria', false],
      ['divisao', 'Divisão', false], ['cargo', 'Cargo', false], ['situacao', 'Situação', false],
      ['estabilidade', 'Estabilidade', false], ['fimEstabilidade', 'Data fim da estabilidade', false],
      ['invalidez', 'Afastamento / invalidez', false], ['custo', 'Salário anual (resumo)', false],
      ['acao', 'Ação indicada, se já vier na planilha', false], ['destino', 'Destino da transferência', false]
    ];
    html += '<div class="bloco cartao cartao-pad">'
      + '<h2 style="font-size:16px;margin-bottom:4px">Conferir colunas — ' + escapar(importacao.arquivo) + '</h2>'
      + '<p style="color:var(--ink-2);margin:0 0 14px">Aba “' + escapar(importacao.aba) + '”, cabeçalho na linha '
      + importacao.linhaCabecalho + ', ' + fmtNumero(importacao.registros.length) + ' linha(s) de dados. '
      + 'Todas as colunas são preservadas — aqui você só indica o papel de cada uma. '
      + '<b>Deixe sem mapear o que não deve subir</b> (CPF, por exemplo).</p>'
      + (importacao.abas.length > 1 ? '<div class="campo" style="max-width:340px;margin-bottom:14px">'
        + '<label for="sel-aba">Aba</label><select id="sel-aba">'
        + importacao.abas.map((a) => '<option value="' + escapar(a.nome) + '"' + (a.nome === importacao.aba ? ' selected' : '') + '>'
          + escapar(a.nome) + ' (' + a.linhas.length + ' linhas)</option>').join('') + '</select></div>' : '')
      + '<div class="tabela-caixa" style="max-height:42vh"><table><thead><tr><th>Informação</th><th>Coluna da planilha</th><th>Exemplo</th></tr></thead><tbody>'
      + chaves.map(([chave, rotulo, obrigatorio]) => {
          const atual = importacao.mapa[chave] || '';
          const exemplo = atual ? (importacao.registros[0] || {})[atual] : '';
          return '<tr><td>' + rotulo + (obrigatorio ? ' <span class="pill aviso">obrigatório</span>' : '') + '</td>'
            + '<td><select data-mapa="' + chave + '"><option value="">— nenhuma —</option>'
            + importacao.cabecalhos.map((c) => '<option value="' + escapar(c) + '"' + (c === atual ? ' selected' : '') + '>'
              + escapar(c) + '</option>').join('') + '</select></td>'
            + '<td class="limite" style="color:var(--ink-3)">' + escapar(String(exemplo || '').slice(0, 40)) + '</td></tr>';

      + '<div class="linha" style="margin-top:14px"><span class="espaco"></span>'

    html += '<div class="bloco"><div class="kpis">'

      + '</div></div>';

      html += '<div class="bloco"><div class="aviso atencao">' + fmtNumero(p.comDecisao)

      + '<div class="tabela-caixa"><table><thead><tr><th>Data</th><th>Usuário</th><th>Arquivo</th><th>Data-base</th>'
      + '<th class="num">Linhas</th><th class="num">Novos</th><th class="num">Alterados</th><th class="num">Erros</th><th>Status</th></tr></thead><tbody>'

        + '<td class="num">' + i.linhas + '</td><td class="num">' + i.novos + '</td><td class="num">' + i.alterados + '</td>'
        + '<td class="num">' + i.erros + '</td><td><span class="pill ativo">concluída</span></td></tr>').join('')
      + '</tbody></table></div></div>';
  }

  return html;
}

function sugerirMapa(cabecalhos) {
  const APELIDOS = {
    chapa: ['chapa', 'matricula', 'registro'], nome: ['nome', 'colaborador'],
    diretoria: ['diretoria'], divisao: ['divisao'], cargo: ['des cargo', 'des_cargo', 'cargo'],
    situacao: ['situacao', 'status'], estabilidade: ['estabilidade'],
    fimEstabilidade: ['data fim estabilidade', 'fim estabilidade'], invalidez: ['tipo invalidez', 'tipo_invalidez', 'afastamento'],
    custo: ['salario anual', 'salario total', 'custo anual'], acao: ['acao indicada', 'acao', 'decisao'],
    destino: ['em caso de transferencia', 'destino', 'para onde'], justificativa: ['justificativa', 'motivo']
  };
  const mapa = {};
  Object.keys(APELIDOS).forEach((chave) => {
    const achado = cabecalhos.find((c) => {
      const n = normalizar(c);
      return APELIDOS[chave].some((apelido) => n === apelido || n.startsWith(apelido));
    });
    if (achado) mapa[chave] = achado;
  });
  return mapa;
}

function prepararImportacao(arquivo, abas, nomeAba) {
  const aba = abas.find((a) => a.nome === nomeAba) || abas[0];
  let linhaCabecalho = 1;
  for (let i = 0; i < Math.min(aba.linhas.length, 15); i += 1) {
    if ((aba.linhas[i] || []).filter((c) => String(c || '').trim()).length >= 3) { linhaCabecalho = i + 1; break; }
  }
  const cabecalhos = (aba.linhas[linhaCabecalho - 1] || [])
    .map((c, i) => String(c || '').replace(/\s+/g, ' ').trim() || 'Coluna ' + (i + 1));
  const registros = [];
  for (let i = linhaCabecalho; i < aba.linhas.length; i += 1) {
    const celulas = aba.linhas[i] || [];
    if (!celulas.some((c) => String(c || '').trim())) continue;
    const registro = {};
    cabecalhos.forEach((c, indice) => { registro[c] = celulas[indice] == null ? '' : String(celulas[indice]); });
    registros.push(registro);
  }
  importacao = { passo: 2, arquivo: arquivo, abas: abas, aba: aba.nome, linhaCabecalho: linhaCabecalho,
    cabecalhos: cabecalhos, registros: registros, mapa: sugerirMapa(cabecalhos) };
  desenhar();
}

function montarPrevia() {
  const mapa = importacao.mapa;
  const existentes = new Map();
  if (estado.mapa.chapa) estado.base.forEach((l) => existentes.set(campo(l, 'chapa'), l));

  const previa = { total: importacao.registros.length, novos: [], alterados: [], inalterados: 0, erros: [], comDecisao: 0 };
  importacao.registros.forEach((registro, indice) => {
    const linhaNumero = importacao.linhaCabecalho + indice + 1;
    const chapa = String(registro[mapa.chapa] || '').trim();
    if (!chapa) { previa.erros.push({ linha: linhaNumero, chapa: '', erro: 'Linha sem matrícula.' }); return; }
    const nome = String(registro[mapa.nome] || '').trim();
    if (!nome) { previa.erros.push({ linha: linhaNumero, chapa: chapa, erro: 'Linha sem nome.' }); return; }

    const atual = existentes.get(chapa);
    if (!atual) { previa.novos.push({ linha: linhaNumero, chapa: chapa, nome: nome }); return; }
    if (estado.decisoes[chapa] && estado.decisoes[chapa].acao) previa.comDecisao += 1;

    const mudancas = [];
    Object.keys(registro).forEach((coluna) => {
      const antes = atual[coluna] == null ? '' : String(atual[coluna]);
      const depois = registro[coluna] == null ? '' : String(registro[coluna]);
      if (antes !== depois) mudancas.push({ campo: coluna, de: antes, para: depois });
    });
    if (mudancas.length) previa.alterados.push({ chapa: chapa, nome: nome, mudancas: mudancas });
    else previa.inalterados += 1;
  });

  importacao.previa = previa;
  importacao.passo = 3;
  desenhar();
}

function confirmarImportacao(trazerDecisoes) {
  const mapa = importacao.mapa;
  const antes = new Map();
  if (estado.mapa.chapa) estado.base.forEach((l) => antes.set(campo(l, 'chapa'), l));

  const novaBase = [];
  let novos = 0;
  let alterados = 0;
  importacao.registros.forEach((registro) => {
    const chapa = String(registro[mapa.chapa] || '').trim();
    const nome = String(registro[mapa.nome] || '').trim();
    if (!chapa || !nome) return;
    if (antes.has(chapa)) alterados += 1; else novos += 1;
    novaBase.push(registro);
  });

  // registros que já estavam na base e não vieram na carga continuam lá
  antes.forEach((linha, chapa) => {
    if (!novaBase.some((r) => String(r[mapa.chapa] || '').trim() === chapa)) novaBase.push(linha);
  });

  estado.cabecalhos = importacao.cabecalhos.slice();
  estado.base = novaBase;
  estado.mapa = Object.assign({}, mapa);
  estado.origemBase = importacao.arquivo;

  if (trazerDecisoes && mapa.acao) {
    novaBase.forEach((registro) => {
      const chapa = String(registro[mapa.chapa] || '').trim();
      const textoAcao = String(registro[mapa.acao] || '').trim();
      if (!chapa || !textoAcao) return;
      const acao = estado.acoes.find((a) => normalizar(a.valor) === normalizar(textoAcao));
      if (!acao) return;
      const anterior = decisaoDe(chapa);
      estado.decisoes[chapa] = {
        acao: acao.valor,
        justificativa: mapa.justificativa ? String(registro[mapa.justificativa] || '') : anterior.justificativa,
        destino: mapa.destino ? String(registro[mapa.destino] || '') : anterior.destino,
        status: 'preenchida', por: 'importado da planilha', em: new Date().toISOString(),
        homologadoPor: anterior.homologadoPor || '', homologadoEm: anterior.homologadoEm || ''
      };
    });
  }

  const usuario = usuarioAtual();
  estado.importacoes.unshift({
    quando: new Date().toISOString(), usuario: usuario.nome, arquivo: importacao.arquivo,
    dataBase: estado.processo.dataBase, linhas: importacao.registros.length,
    novos: novos, alterados: alterados, erros: importacao.previa.erros.length
  });
  auditar({ tipo: 'Importação', chapa: '', colaborador: '', campo: 'carga', de: '—',
    para: fmtNumero(importacao.registros.length) + ' linhas · ' + novos + ' novos · ' + alterados + ' alterados'
      + (trazerDecisoes ? ' · decisões da planilha aplicadas' : '') });

  importacao = null;
  estado.tela = 'colaboradores';
  filtros = {};
  salvar();
  desenhar();
  toast('Base atualizada: ' + novos + ' incluído(s) e ' + alterados + ' atualizado(s).');
}

function ligarImportar() {
  const arquivo = document.getElementById('arquivo');
  if (arquivo) arquivo.addEventListener('change', async () => {
    const escolhido = arquivo.files[0];
    if (!escolhido) return;
    toast('Lendo a planilha...');
    try {
      const { abas } = await lerPlanilha(escolhido);
      const comDados = abas.filter((a) => a.linhas.length > 1);
      if (!comDados.length) throw new Error('Nenhuma aba com dados encontrada.');
      const escolhida = comDados.find((a) => normalizar(a.nome).includes('base')) || comDados[0];
      prepararImportacao(escolhido.name, abas, escolhida.nome);
    } catch (erro) {
      toast(erro.message, 'erro');
    }
  });

  const exemplo = document.getElementById('btn-exemplo');
  if (exemplo) exemplo.addEventListener('click', () => {
    const linhas = baseDeExemplo();
    const cabecalhos = Object.keys(linhas[0]);
    const abas = [{ nome: '2. BASE DECISÕES_CONS', linhas: [cabecalhos].concat(linhas.map((l) => cabecalhos.map((c) => l[c]))) }];
    prepararImportacao('base-exemplo-ficticia.xlsx', abas, abas[0].nome);
  });

  const seletorAba = document.getElementById('sel-aba');
  if (seletorAba) seletorAba.addEventListener('change', () => {
    prepararImportacao(importacao.arquivo, importacao.abas, seletorAba.value);
  });

  document.querySelectorAll('[data-mapa]').forEach((seletor) => {
    seletor.addEventListener('change', () => {
      if (seletor.value) importacao.mapa[seletor.dataset.mapa] = seletor.value;
      else delete importacao.mapa[seletor.dataset.mapa];
    });
  });

  const previa = document.getElementById('btn-previa');
  if (previa) previa.addEventListener('click', () => {
    if (!importacao.mapa.chapa || !importacao.mapa.nome) { toast('Indique ao menos a matrícula e o nome.', 'erro'); return; }
    montarPrevia();
  });

  const cancelar = document.getElementById('btn-cancelar-import');
  if (cancelar) cancelar.addEventListener('click', () => { importacao = null; desenhar(); });
  const voltar = document.getElementById('btn-voltar-import');
  if (voltar) voltar.addEventListener('click', () => { importacao.passo = 2; desenhar(); });
  const confirmar = document.getElementById('btn-confirmar-import');
  if (confirmar) confirmar.addEventListener('click', () => {
    const marcado = document.getElementById('import-decisoes');
    confirmarImportacao(!!(marcado && marcado.checked));
  });
}

function senhaProvisoria() {
  const letras = 'abcdefghjkmnpqrstuvwxyz';
  const numeros = '23456789';
  let senha = '';
  for (let i = 0; i < 6; i += 1) senha += letras[Math.floor(Math.random() * letras.length)];
  for (let i = 0; i < 3; i += 1) senha += numeros[Math.floor(Math.random() * numeros.length)];
  return senha;
}

function ligarUsuarios() {
  const perfilSelect = document.getElementById('novo-perfil');
  const escopoSelect = document.getElementById('novo-escopo');
  const trocarOpcoes = () => {
    if (!perfilSelect || !escopoSelect) return;
    const lista = perfilSelect.value === 'diretor' ? DIRETORIAS_TODAS : DIVISOES_TODAS;
    escopoSelect.innerHTML = lista.map((d) => '<option value="' + escapar(d) + '">' + escapar(d) + '</option>').join('');
    escopoSelect.disabled = perfilSelect.value === 'admin';
  };
  if (perfilSelect) perfilSelect.addEventListener('change', trocarOpcoes);

  const form = document.getElementById('form-usuario');
  if (form) form.addEventListener('submit', (evento) => {
    evento.preventDefault();
    const login = normalizar(document.getElementById('novo-login').value).replace(/[^a-z0-9._-]/g, '');
    const nome = document.getElementById('novo-nome').value.trim();
    const perfil = perfilSelect.value;
    const escolhidos = [...escopoSelect.selectedOptions].map((o) => o.value);
    if (login.length < 3) { toast('Informe um usuário com ao menos 3 caracteres.', 'erro'); return; }
    if (estado.usuarios.some((u) => u.usuario === login)) { toast('Já existe um usuário com esse login.', 'erro'); return; }
    if (perfil !== 'admin' && !escolhidos.length) { toast('Escolha a abrangência (Divisões ou Diretorias).', 'erro'); return; }

    const senha = senhaProvisoria();
    estado.usuarios.push({
      usuario: login, nome: nome, perfil: perfil, senha: senha, trocarSenha: true, ativo: true,
      diretorias: perfil === 'diretor' ? escolhidos : [],
      divisoes: perfil === 'gestor' ? escolhidos : []
    });
    auditar({ tipo: 'Usuário', chapa: '', colaborador: '', campo: 'criação', de: '—', para: login + ' (' + perfil + ')' });
    salvar();
    desenhar();
    mostrarSenha(nome, login, senha);
  });

  document.querySelectorAll('[data-perfil]').forEach((seletor) => {
    seletor.addEventListener('change', () => {
      const usuario = estado.usuarios.find((u) => u.usuario === seletor.dataset.perfil);
      const anterior = usuario.perfil;
      usuario.perfil = seletor.value;
      if (usuario.perfil === 'admin') { usuario.diretorias = []; usuario.divisoes = []; }
      auditar({ tipo: 'Permissão', chapa: '', colaborador: '', campo: 'perfil de ' + usuario.usuario, de: anterior, para: usuario.perfil });
      salvar();
      desenhar();
      toast('Perfil atualizado.');
    });
  });

  document.querySelectorAll('[data-escopo]').forEach((botao) => {
    botao.addEventListener('click', () => abrirEscopo(botao.dataset.escopo));
  });
  document.querySelectorAll('[data-senha]').forEach((botao) => {
    botao.addEventListener('click', () => {
      const usuario = estado.usuarios.find((u) => u.usuario === botao.dataset.senha);
      const senha = senhaProvisoria();
      usuario.senha = senha;
      usuario.trocarSenha = true;
      auditar({ tipo: 'Usuário', chapa: '', colaborador: '', campo: 'senha de ' + usuario.usuario, de: '—', para: 'nova senha provisória' });
      salvar();
      desenhar();
      mostrarSenha(usuario.nome, usuario.usuario, senha);
    });
  });
  document.querySelectorAll('[data-ativar]').forEach((botao) => {
    botao.addEventListener('click', () => {
      const usuario = estado.usuarios.find((u) => u.usuario === botao.dataset.ativar);
      if (usuario.usuario === estado.sessao) { toast('Você não pode desativar o próprio acesso.', 'erro'); return; }
      usuario.ativo = !usuario.ativo;
      auditar({ tipo: 'Usuário', chapa: '', colaborador: '', campo: 'situação de ' + usuario.usuario,
        de: usuario.ativo ? 'inativo' : 'ativo', para: usuario.ativo ? 'ativo' : 'inativo' });
      salvar();
      desenhar();
    });
  });

    const anterior = (ehGestor ? usuario.divisoes : usuario.diretorias).join(', ');
    if (ehGestor) usuario.divisoes = marcados; else usuario.diretorias = marcados;
    auditar({ tipo: 'Permissão', chapa: '', colaborador: '', campo: 'abrangência de ' + usuario.usuario,
      de: anterior || '—', para: marcados.join(', ') || '—' });
    salvar();
    dlg.close();
    desenhar();
    toast('Abrangência atualizada.');
  });
  dlg.showModal();
}

      + '<div class="campo" style="flex:2"><label for="cfg-nome">Nome do processo</label>'
      + '<input id="cfg-nome" type="text" value="' + escapar(estado.processo.nome) + '"></div>'

        + '<td><input type="checkbox" data-acao-cfg="' + i + '" data-campo="ativo"' + (a.ativo ? ' checked' : '') + '></td></tr>').join('')
      + '</tbody></table></div></div>'
      + '<div class="bloco cartao cartao-pad"><div class="linha">'
      + '<div class="campo" style="flex:2"><label for="nova-acao">Nova ação</label>'
      + '<input id="nova-acao" type="text" placeholder="Ex.: APOSENTADORIA"></div>'
      + '<button class="btn" id="btn-nova-acao" type="button">Adicionar</button></div></div>';
  }

  if (abaConfig === 'Regras e alertas') {
    html += '<div class="bloco"><div class="bloco-cab"><h2>Regras de alerta</h2>'
      + '<p>o portal sinaliza e pode exigir justificativa — nenhuma decisão trabalhista é automática</p></div>'
      + '<div class="tabela-caixa"><table><thead><tr><th>Regra</th><th>Condição</th><th>Mensagem</th>'
      + '<th>Severidade</th><th>Aplica-se à ação</th><th>Exige justificativa</th><th>Ativa</th></tr></thead><tbody>'
      + estado.regras.map((r, i) => '<tr><td><b>' + escapar(r.nome) + '</b></td>'
        + '<td style="color:var(--ink-2)">' + escapar(r.campo + ' ' + r.operador + (r.valor ? ' ' + r.valor : '')) + '</td>'

function ligarConfig() {
  document.querySelectorAll('[data-aba-config]').forEach((botao) => {
    botao.addEventListener('click', () => { abaConfig = botao.dataset.abaConfig; desenhar(); });
  });

  ['cfg-nome', 'cfg-base', 'cfg-prazo', 'cfg-aviso'].forEach((id) => {
    const alvo = document.getElementById(id);
    if (!alvo) return;
    alvo.addEventListener('change', () => {
      const chave = id === 'cfg-nome' ? 'nome' : id === 'cfg-base' ? 'dataBase' : id === 'cfg-prazo' ? 'prazo' : 'aviso';
      const anterior = estado.processo[chave];
      estado.processo[chave] = alvo.value.trim();
      auditar({ tipo: 'Configuração', chapa: '', colaborador: '', campo: chave, de: anterior, para: estado.processo[chave] });
      salvar();
      desenhar();
      toast('Processo atualizado.');
    });
  });

  document.querySelectorAll('[data-acao-cfg]').forEach((caixa) => {
    caixa.addEventListener('change', () => {
      const acao = estado.acoes[Number(caixa.dataset.acaoCfg)];
      acao[caixa.dataset.campo] = caixa.checked;
      auditar({ tipo: 'Configuração', chapa: '', colaborador: '', campo: 'ação ' + acao.valor + ' · ' + caixa.dataset.campo,
        de: String(!caixa.checked), para: String(caixa.checked) });
      salvar();
      desenhar();
    });
  });

  const novaAcao = document.getElementById('btn-nova-acao');
  if (novaAcao) novaAcao.addEventListener('click', () => {
    const entrada = document.getElementById('nova-acao');
    const valor = entrada.value.trim().toUpperCase();
    if (!valor) return;
    if (estado.acoes.some((a) => a.valor === valor)) { toast('Já existe uma ação com esse nome.', 'erro'); return; }
    estado.acoes.push({ valor: valor, cor: 'pendente', exigeJustificativa: true, exigeDestino: false, reducao: false, ativo: true });
    auditar({ tipo: 'Configuração', chapa: '', colaborador: '', campo: 'nova ação', de: '—', para: valor });
    salvar();
    desenhar();
    toast('Ação criada.');
  });

  document.querySelectorAll('[data-regra-cfg]').forEach((caixa) => {
    caixa.addEventListener('change', () => {
      const regra = estado.regras[Number(caixa.dataset.regraCfg)];
      regra[caixa.dataset.campo] = caixa.checked;
      auditar({ tipo: 'Configuração', chapa: '', colaborador: '', campo: 'regra ' + regra.nome + ' · ' + caixa.dataset.campo,
        de: String(!caixa.checked), para: String(caixa.checked) });
      salvar();
      desenhar();
    });
  });
}

function ligarAuditoria() {
  const chapa = document.getElementById('aud-chapa');

    if (novo) { novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }

  if (tipo) tipo.addEventListener('change', () => { filtros.audTipo = tipo.value; desenhar(); });
}

/**
 * Entrega o arquivo ao usuário. No protótipo publicado, o visualizador media o download
 * pela capacidade "downloads"; no arquivo aberto localmente, usa o download comum.
 */
async function entregarArquivo(blob, nome) {
  try {
    const downloads = (window.claude && typeof window.claude.use === 'function')
      ? await window.claude.use('downloads')
      : null;
    if (downloads) {
      await downloads.save({ filename: nome, data: blob });
      return 'salvo';
    }
  } catch (erro) {
    if (erro && erro.code === 'declined') return 'cancelado';
    if (erro && (erro.code === 'rate_limited' || erro.code === 'bad_request')) return 'falhou';
    // qualquer outro caso: tenta o download comum abaixo
  }
  baixar(blob, nome);
  return 'baixado';
}

async function exportarExcel() {
  if (!estado.base.length) { toast('Carregue a base antes de exportar.', 'erro'); return; }
  const lista = visiveis();
  const r = calcular(lista);
  const usuario = usuarioAtual();

  const resumo = [
    [estado.processo.nome + ' — posição de ' + fmtData(estado.processo.dataBase)],
    [],
    ['Prazo', fmtData(estado.processo.prazo)],
    ['Gerado em', new Date().toLocaleString('pt-BR')],
    ['Gerado por', usuario.nome + ' (' + usuario.perfil + ')'],
    [],
    ['Indicador', 'Quantidade'],
    ['Total de colaboradores', r.total],
    ['Desligados na posição-base', r.desligados],
    ['Avaliações preenchidas', r.avaliados],
    ['Pendentes', r.pendentes],
    ['Homologadas', r.homologadas],
    ['Com alerta do RH', r.comAlerta],
    [],
    ['Ação indicada', 'Pessoas']
  ];
  r.porAcao.forEach((a) => resumo.push([a.rotulo, a.total]));
  resumo.push([], ['Divisão', 'Total', 'Avaliados', 'Pendentes', 'Desligamentos', 'Transferências']);
  agrupar(lista, 'divisao').forEach(([nome, l]) =>
    resumo.push([nome, l.total, l.avaliados, l.total - l.avaliados, l.desligamentos, l.transferencias]));

  const extras = ['AÇÃO INDICADA (portal)', 'DESTINO DA TRANSFERÊNCIA', 'JUSTIFICATIVA', 'STATUS', 'ALERTAS', 'PREENCHIDO POR', 'PREENCHIDO EM'];
  const base = [estado.cabecalhos.concat(extras)];
  lista.forEach((linha) => {
    const decisao = decisaoDe(campo(linha, 'chapa'));
    base.push(estado.cabecalhos.map((c) => (linha[c] == null ? '' : String(linha[c]))).concat([
      decisao.acao || '', decisao.destino || '', decisao.justificativa || '',
      decisao.status === 'homologada' ? 'Homologada' : decisao.status === 'preenchida' ? 'Preenchida' : 'Pendente',
      alertasDe(linha).map((a) => a.mensagem).join(' | '),
      decisao.por || '', decisao.em ? new Date(decisao.em).toLocaleString('pt-BR') : ''
    ]));
  });

  const auditoria = [['Quando', 'Usuário', 'Perfil', 'Evento', 'Matrícula', 'Colaborador', 'Campo', 'De', 'Para']]
    .concat(estado.auditoria.slice(0, 1500).map((e) => [fmtDataHora(e.quando), e.usuario, e.perfil, e.tipo,
      e.chapa || '', e.colaborador || '', e.campo || '', e.de || '', e.para || '']));

  const abas = [
    { nome: '1. Resumo', linhas: resumo },
    { nome: '2. Base Decisões', linhas: base,
      opcoes: { colunaLista: estado.cabecalhos.length + 1, opcoesLista: estado.acoes.filter((a) => a.ativo).map((a) => a.valor) } },
    { nome: '3. Auditoria', linhas: auditoria }
  ];

  const nome = 'decisoes-' + normalizar(estado.processo.nome).replace(/[^a-z0-9]+/g, '-')
    + '-' + new Date().toISOString().slice(0, 10) + '.xlsx';
  toast('Gerando a planilha...');
  const resultado = await entregarArquivo(montarXlsx(abas), nome);
  if (resultado === 'cancelado') { toast('Download cancelado.', 'erro'); return; }
  if (resultado === 'falhou') { toast('Não foi possível entregar o arquivo agora. Tente de novo em instantes.', 'erro'); return; }
  auditar({ tipo: 'Exportação', chapa: '', colaborador: '', campo: 'planilha', de: '—', para: fmtNumero(lista.length) + ' linhas' });
  salvar();
  toast('Excel gerado com ' + fmtNumero(lista.length) + ' linha(s) — só o que este perfil pode ver.');
}

/* ==================================================================
   14. DESENHO E EVENTOS
================================================================== */
function desenhar() {
  const raiz = document.getElementById('raiz');
  const usuario = usuarioAtual();

  if (!usuario) { raiz.innerHTML = telaLogin(); ligarLogin(); return; }
  if (usuario.trocarSenha) { raiz.innerHTML = telaTrocarSenha(); ligarTrocaSenha(); return; }
  if (!menuDoPerfil().includes(estado.tela)) estado.tela = 'painel';

  let conteudo = '';
  if (estado.tela === 'painel') conteudo = telaPainel();
  else if (estado.tela === 'avaliacoes' || estado.tela === 'colaboradores') conteudo = telaLista();
  else if (estado.tela === 'importar') conteudo = telaImportar();
  else if (estado.tela === 'usuarios') conteudo = telaUsuarios();
  else if (estado.tela === 'config') conteudo = telaConfig();
  else if (estado.tela === 'auditoria') conteudo = telaAuditoria();

  raiz.innerHTML = moldura(conteudo);

  raiz.querySelectorAll('[data-tela]').forEach((botao) => {
    botao.addEventListener('click', () => {
      estado.tela = botao.dataset.tela;
      filtros = {};
      selecao = [];
      importacao = null;
      desenhar();
    });
  });
  raiz.querySelectorAll('[data-acao-menu]').forEach((botao) => {
    botao.addEventListener('click', () => {
      const acao = botao.dataset.acaoMenu;
      if (acao === 'sair') {
        auditar({ tipo: 'Logout', chapa: '', colaborador: '', campo: '', de: '', para: usuarioAtual().nome });
        estado.sessao = null;
        salvar();
        desenhar();
      } else if (acao === 'exportar') {
        exportarExcel();
      } else if (acao === 'reiniciar') {
        if (!confirm('Reiniciar o protótipo? Base, decisões, usuários e auditoria voltam ao estado inicial.')) return;
        estado = estadoInicial();
        filtros = {};
        selecao = [];
        importacao = null;
        salvar();
        desenhar();
        toast('Protótipo reiniciado.');
      }
    });
  });

  if (estado.tela === 'avaliacoes' || estado.tela === 'colaboradores') ligarLista();
  if (estado.tela === 'importar') ligarImportar();
  if (estado.tela === 'usuarios') ligarUsuarios();
  if (estado.tela === 'config') ligarConfig();
  if (estado.tela === 'auditoria') ligarAuditoria();
}

function ligarLogin() {
  const form = document.getElementById('form-login');
  form.addEventListener('submit', (evento) => {
    evento.preventDefault();
    const erro = entrar(document.getElementById('usuario').value.trim(), document.getElementById('senha').value);
    if (erro) { document.getElementById('raiz').innerHTML = telaLogin(erro); ligarLogin(); return; }
    desenhar();
  });
  document.querySelectorAll('[data-entrar]').forEach((botao) => {
    botao.addEventListener('click', () => {
      const erro = entrar(botao.dataset.entrar, 'portal');
      if (erro) { document.getElementById('raiz').innerHTML = telaLogin(erro); ligarLogin(); return; }
      desenhar();
    });
  });
}

function ligarTrocaSenha() {
  document.getElementById('form-senha').addEventListener('submit', (evento) => {
    evento.preventDefault();
    const nova = document.getElementById('nova').value;
    const repetida = document.getElementById('nova2').value;
    if (nova.length < 8) { toast('A senha deve ter ao menos 8 caracteres.', 'erro'); return; }
    if (nova !== repetida) { toast('A confirmação não confere.', 'erro'); return; }
    const usuario = usuarioAtual();
    usuario.senha = nova;
    usuario.trocarSenha = false;
    auditar({ tipo: 'Senha', chapa: '', colaborador: '', campo: 'troca de senha', de: 'provisória', para: 'definida pelo usuário' });
    salvar();
    desenhar();
    toast('Senha atualizada. Bem-vindo(a), ' + usuario.nome + '.');
  });
}

restaurar();
desenhar();
})();
