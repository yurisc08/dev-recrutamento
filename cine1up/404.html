<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessão encerrada — CINE 1UP</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/effects.css">
<link rel="stylesheet" href="/assets/css/arcade.css">
<style>
  .erro { min-height:100svh; display:grid; place-items:center; text-align:center; position:relative; overflow:hidden }
  .erro canvas { position:absolute; inset:0; width:100%; height:100%; z-index:0 }
  .erro__box { position:relative; z-index:2; padding:var(--gut) }
  .erro h1 { font-size:clamp(6rem,26vw,18rem); line-height:.8 }
</style>
</head>
<body>
<div class="fx-layer fx-grain"></div>
<div class="crt-vinheta"></div>
<div class="fx-layer fx-flash"></div>

<section class="erro">
  <canvas id="raios404"></canvas>
  <div class="erro__box">
    <h1 class="gradient-text">404</h1>
    <p class="lead" style="margin:20px auto 32px">
      Essa cena foi cortada na montagem. O link não existe mais — ou nunca existiu.
    </p>
    <div class="row" style="justify-content:center">
      <a class="btn btn--solid" href="/">Voltar ao início</a>
      <a class="btn btn--ghost" href="/criticas.html">Ver as críticas</a>
    </div>
  </div>
</section>

<script src="/assets/js/lightning.js"></script>
<script src="/assets/js/fx.js"></script>
<script>
  var cv = document.getElementById('raios404');
  if (window.Storm && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    new window.Storm(cv, {
      intervalo: [900, 2400],
      aoRaio: function (e) {
        var w = cv.getBoundingClientRect().width || 1;
        window.FX && window.FX.flash((e.x / w) * 100);
      }
    }).start();
  }
</script>
</body>
</html>
