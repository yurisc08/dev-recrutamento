# Proxy reverso com TLS interno. O portal escuta em 127.0.0.1:3000 (HOST=127.0.0.1).
# Publique apenas na rede interna: libere no firewall somente as faixas da empresa/VPN.

server {
    listen 443 ssl;
    server_name portal-decisoes.empresa.interno;

    ssl_certificate     /etc/ssl/certs/portal-decisoes.crt;   # certificado da CA interna
    ssl_certificate_key /etc/ssl/private/portal-decisoes.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restrinja o acesso às faixas internas (ajuste conforme a sua rede).
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # exportações grandes
    }
}

server {
    listen 80;
    server_name portal-decisoes.empresa.interno;
    return 301 https://$host$request_uri;
}
